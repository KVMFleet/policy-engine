[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvmfleet-policy-engine"
version = "0.2.0"
description = "Small opinionated policy engine for access control over hardware-shaped resources (BMCs, network gear, similar). Four rule types: time-of-day windows, require-MFA, max-concurrent-sessions, approval-required. Pure functions; no DB; no async. Powers KVM Fleet's hosted access-governance platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["policy", "policy-engine", "access-control", "abac", "rbac", "authz", "bmc", "ipmi"]
authors = [
  { name = "KVM Fleet", email = "support@kvmfleet.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KVMFleet/policy-engine"
Repository = "https://github.com/KVMFleet/policy-engine"
Issues = "https://github.com/KVMFleet/policy-engine/issues"
"KVM Fleet" = "https://kvmfleet.io"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["kvmfleet_policy_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
